[project]
name = "civic-lens-ai"
version = "1.0.0"
description = "Election Process Education Assistant powered by Google Gemini 2.5 Flash & Vertex AI"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["elections", "civic-education", "gemini", "vertex-ai", "fastapi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "C4", "SIM"]
ignore = ["S101"]  # Allow assert in tests
